<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Noto Sans CJK SC', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
        }
        .date {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }
        .section {
            margin: 20px 0;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .metric-label {
            font-weight: 500;
        }
        .metric-value {
            font-weight: bold;
            color: #0066cc;
        }
        .footer {
            margin-top: 40px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">日报 (Daily Report)</div>
        <div class="date">{{ date }}</div>
    </div>

    <div class="section">
        <div class="section-title">活动统计 (Activity Summary)</div>
        <div class="metric">
            <span class="metric-label">任务完成数 (Task Completions)</span>
            <span class="metric-value">{{ task_completions }}</span>
        </div>
        <div class="metric">
            <span class="metric-label">审批数 (Approvals)</span>
            <span class="metric-value">{{ approvals }}</span>
        </div>
        <div class="metric">
            <span class="metric-label">活动记录数 (Activities)</span>
            <span class="metric-value">{{ activities }}</span>
        </div>
    </div>

    <div class="footer">
        <div>操作员 (Operator): {{ operator }}</div>
        <div>生成时间 (Generated): {{ timestamp }}</div>
        <div>运行ID (Run ID): {{ run_id }}</div>
    </div>
</body>
</html>
